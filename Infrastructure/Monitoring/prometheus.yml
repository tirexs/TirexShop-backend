global:
  scrape_interval: 10s

scrape_configs:
  - job_name: 'ApiGateway'
    static_configs:
      - targets: ['ApiGateway:8080']

  - job_name: 'IdentityService'
    static_configs:
      - targets: ['IdentityService:8080']
          
  - job_name: 'cadvisor'
    static_configs:
      - targets: [ 'cadvisor:8080' ]